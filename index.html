<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนที่จุดติดตั้งกล้อง CCTV · เขตคลองเตย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e5e7eb;
    --digital:#2563eb; --analog:#f59e0b; --traffic:#e11d48;
    --accent:#0f766e; --radius:14px;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"IBM Plex Sans Thai",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  .app{display:grid;grid-template-columns:380px 1fr;height:100vh}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:500}
  .head{padding:22px 22px 14px}
  .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent);background:#ccfbf1;padding:3px 10px;border-radius:999px;letter-spacing:.2px}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
  h1{font-size:21px;line-height:1.3;margin:10px 0 2px;font-weight:700}
  .sub{color:var(--muted);font-size:13px;margin:0}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 22px 14px}
  .stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat .l{font-size:12px;color:var(--muted)}
  .section{padding:0 22px 12px}
  .label{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.4px}
  .chips{display:flex;flex-direction:column;gap:6px}
  .chip{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;font-size:14px;text-align:left;transition:.15s}
  .chip:hover{border-color:#cbd5e1}
  .chip .sw{width:12px;height:12px;border-radius:4px;flex:none}
  .chip .name{flex:1;font-weight:500}
  .chip .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chip .bar{height:4px;border-radius:2px;background:#eef2f7;margin-top:5px;overflow:hidden}
  .chip .bar i{display:block;height:100%}
  .chip.off{opacity:.45}
  .chip.off .sw{background:#cbd5e1!important}
  .row{display:flex;gap:8px}
  .search{position:relative;flex:1}
  .search input,select{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;outline:none;background:#fff;color:var(--ink)}
  select{padding-left:10px;width:auto;cursor:pointer}
  .search input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .listhead{display:flex;justify-content:space-between;align-items:center;padding:4px 22px 8px;font-size:13px;color:var(--muted)}
  .toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent)}
  .list{flex:1;overflow:auto;border-top:1px solid var(--line);min-height:0}
  .item{display:flex;gap:12px;align-items:center;padding:10px 22px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .12s}
  .item:hover,.item.active{background:#f0fdfa}
  .badge{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  .item .t{font-size:14px;font-weight:500;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .item .c{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .empty{padding:30px 22px;color:var(--muted);text-align:center;font-size:14px}
  #map{height:100%;width:100%;background:#e8ecef}
  .mapwrap{position:relative;min-width:0}
  .legend{position:absolute;right:14px;bottom:24px;z-index:450;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;font-size:13px}
  .legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
  .legend span{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  .legend small{display:block;color:var(--muted);margin-top:4px;font-size:11px}
  /* markers */
  .pin{border-radius:50%;color:#fff;font-weight:700;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);font-family:"IBM Plex Sans Thai",sans-serif;transition:transform .15s}
  .pin.hl{transform:scale(1.35);box-shadow:0 0 0 4px rgba(15,118,110,.35),0 2px 8px rgba(0,0,0,.35)}
  .cluster{border-radius:50%;display:grid;place-items:center;color:#0f172a;font-weight:700;font-size:13px;background:rgba(255,255,255,.95);border:3px solid var(--accent);box-shadow:0 0 0 6px rgba(15,118,110,.18),0 2px 8px rgba(0,0,0,.2)}
  .cluster small{display:block;font-size:8.5px;white-space:nowrap;font-weight:500;color:var(--muted);line-height:1;margin-top:-2px}
  .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:var(--shadow)}
  .leaflet-popup-content{margin:14px 16px;font-family:"IBM Plex Sans Thai",sans-serif;min-width:220px}
  .pp .type{display:inline-block;font-size:11px;font-weight:600;color:#fff;padding:2px 8px;border-radius:999px}
  .pp h3{margin:8px 0 2px;font-size:15px;line-height:1.35}
  .pp .code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
  .pp dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0;font-size:13px}
  .pp dt{color:var(--muted)} .pp dd{margin:0;font-variant-numeric:tabular-nums}
  .pp a{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
  .pp a:hover{text-decoration:underline}
  .mtop,.msum{display:none}
  .locbtn{width:34px;height:34px;display:grid;place-items:center;background:#fff;border:0;cursor:pointer;color:var(--ink)}
  .locbtn:hover{background:#f4f4f4}
  .locbtn.busy svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .me{width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25)}
  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;z-index:900;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:.92}

  /* ================= MOBILE ================= */
  @media (max-width:800px){
    html,body{height:100%;overflow:hidden;overscroll-behavior:none}
    .app{display:block;height:100dvh}
    .mapwrap{position:fixed;inset:0}
    .desk,.stats,.eyebrow,.legend,.leaflet-control-zoom{display:none!important}

    /* top bar: search + filter pills */
    .mtop{display:block;position:fixed;top:0;left:0;right:0;z-index:600;
      padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
      background:linear-gradient(to bottom,rgba(245,246,248,.97) 60%,rgba(245,246,248,0))}
    .mtop .search input{font-size:16px;padding:12px 40px 12px 40px;border-radius:14px;border:1px solid transparent;box-shadow:0 2px 10px rgba(15,23,42,.14)}
    .mtop .search svg{left:14px}
    .mtop .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:none;color:var(--muted);font-size:20px;display:none;cursor:pointer}
    .mtop .clr.on{display:block}
    .mchips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .mchips::-webkit-scrollbar{display:none}
    .mchip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:#fff;border-radius:999px;
      padding:8px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);box-shadow:0 1px 4px rgba(15,23,42,.14);cursor:pointer;min-height:38px}
    .mchip .sw{width:10px;height:10px;border-radius:50%}
    .mchip small{font-weight:500;color:var(--muted);font-size:12px}
    .mchip.off{background:#eef1f4;box-shadow:none;color:var(--muted)}
    .mchip.off .sw{background:#cbd5e1!important}

    /* bottom sheet */
    aside{position:fixed;left:0;right:0;bottom:0;top:auto;height:var(--sheet-h,88px);border:0;border-radius:20px 20px 0 0;
      box-shadow:0 -6px 30px rgba(15,23,42,.2);transition:height .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom);z-index:700}
    aside.dragging{transition:none}
    .head{padding:8px 18px 10px;touch-action:none;cursor:grab;user-select:none}
    .head::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:#cbd5e1;margin:0 auto 10px}
    h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sub{display:none}
    .msum{display:flex;justify-content:space-between;align-items:center;margin:3px 0 0;font-size:13px;color:var(--muted)}
    .msum b{color:var(--ink);font-variant-numeric:tabular-nums}
    .msum .hint{color:var(--accent);font-weight:600;display:flex;align-items:center;gap:4px}
    .msum .hint svg{transition:transform .25s}
    aside.expanded .msum .hint svg{transform:rotate(180deg)}
    aside{overflow:hidden}
    .listhead{padding:2px 18px 10px;gap:10px;justify-content:space-between}
    #count{display:none}
    .toggle{white-space:nowrap;font-size:14px}
    .listhead select{font-size:14px;padding:6px 8px;border-radius:8px}
    .item{padding:12px 18px;min-height:60px}
    .item .t{font-size:15px}
    .badge{width:38px;height:38px}

    .leaflet-top{top:calc(env(safe-area-inset-top) + 112px)}
    .leaflet-bottom{bottom:calc(88px + env(safe-area-inset-bottom))}
    .leaflet-control-layers-toggle{width:40px;height:40px}
    .locbtn{width:40px;height:40px}
    .leaflet-popup-content{min-width:200px;margin:12px 14px}
    .pp a{padding:8px 0}
    .toast{top:calc(env(safe-area-inset-top) + 120px)}
  }
</style>
</head>

<div class="app">

      <input id="mq" type="search" placeholder="ค้นหาชื่อจุด หรือรหัส…" autocomplete="off" enterkeyhint="search">
      <button class="clr" id="mclr" aria-label="ล้างคำค้น">×</button>
    </div>
    <div class="mchips" id="mchips"></div>
  </div>
  <div class="toast" id="toast"></div>
  <aside id="panel">

        <span class="hint"><span id="hintTxt">ดูรายการ</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 15 6-6 6 6"/></svg></span></p>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="sPts">0</div><div class="l">จุดที่แสดง</div></div>
      <div class="stat"><div class="n" id="sCams">0</div><div class="l">กล้องที่แสดง</div></div>
    </div>
    <div class="section desk">

    <div class="section desk">

          <input id="q" type="search" placeholder="ค้นหาชื่อจุด หรือรหัส…" autocomplete="off">
        </div>
        <select id="sort" title="เรียงลำดับ">
          <option value="code">เรียงตามรหัส</option>
          <option value="cams">กล้องมาก → น้อย</option>
          <option value="name">เรียงตามชื่อ</option>
        </select>
      </div>
    </div>
    <div class="listhead">
      <span id="count"></span>
      <select id="msort" class="msort" title="เรียงลำดับ" style="display:none">
        <option value="code">เรียงตามรหัส</option>
        <option value="cams">กล้องมาก → น้อย</option>
        <option value="name">เรียงตามชื่อ</option>
      </select>
      <label class="toggle"><input type="checkbox" id="cluster"> รวมกลุ่ม</label>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="legend">
      <div><span style="background:var(--digital)"></span>Digital</div>
      <div><span style="background:var(--analog)"></span>Analog</div>
      <div><span style="background:var(--traffic)"></span>จราจร</div>
      <small>ตัวเลขในหมุด = จำนวนกล้อง</small>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const mq = window.matchMedia('(max-width:800px)');
const isMobile = () => mq.matches;
const TYPES = {
  'Digital': {color:getComputedStyle(document.documentElement).getPropertyValue('--digital').trim(), label:'Digital'},
  'Analog':  {color:getComputedStyle(document.documentElement).getPropertyValue('--analog').trim(),  label:'Analog'},
  'จราจร':   {color:getComputedStyle(document.documentElement).getPropertyValue('--traffic').trim(), label:'จราจร'}
};


const raw = document.getElementById('data').textContent.trim().split(/\r?\n/);
raw.shift();
const points = raw.map(line => {
  const [code, name, cams, lat, lng, type] = line.split(',');
  return {code:code.trim(), name:(name||'').trim() || 'ไม่ระบุชื่อจุด', cams:+cams||0, lat:+lat, lng:+lng, type:(type||'').trim()};
}).filter(p => isFinite(p.lat) && isFinite(p.lng) && p.lat && p.lng);

const totalCams = points.reduce((s,p)=>s+p.cams,0);
document.getElementById('subline').textContent =
  `ทั้งหมด ${points.length.toLocaleString('th-TH')} จุด · ${totalCams.toLocaleString('th-TH')} กล้อง`;


const map = L.map('map', {zoomControl:false, preferCanvas:false}).setView([13.718, 100.574], 14);
L.control.zoom({position:'topright'}).addTo(map);
const esri = (path, attr) => L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/${path}/MapServer/tile/{z}/{y}/{x}`,
    {maxZoom:20, maxNativeZoom:attr.nz||19, attribution:attr.a||'Tiles © Esri'});
const bases = {
  'แผนที่สว่าง': esri('Canvas/World_Light_Gray_Base', {nz:16, a:'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap'}),
  'แผนที่ถนน (OSM)': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:20, maxNativeZoom:19, attribution:'© OpenStreetMap contributors'}),
  'แผนที่ถนน (Esri)': esri('World_Street_Map', {nz:19}),
  'แผนที่มืด': esri('Canvas/World_Dark_Gray_Base', {nz:16, a:'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap'}),
  'ภาพดาวเทียม': esri('World_Imagery', {nz:19})
};
bases['แผนที่สว่าง'].addTo(map);
L.control.layers(bases, null, {position:'topright'}).addTo(map);
L.control.scale({imperial:false, position:'bottomleft'}).addTo(map);

const clusterLayer = L.markerClusterGroup({
  showCoverageOnHover:false, maxClusterRadius:45, spiderfyOnMaxZoom:true,
  iconCreateFunction: c => {
    const ms = c.getAllChildMarkers();
    const cams = ms.reduce((s,m)=>s+m.options.pt.cams,0);
    const size = Math.min(64, 42 + Math.sqrt(ms.length)*3);
    return L.divIcon({className:'', iconSize:[size,size],
      html:`<div class="cluster" style="width:${size}px;height:${size}px"><div style="text-align:center">${ms.length}<small>${cams} กล้อง</small></div></div>`});
  }
});
const plainLayer = L.layerGroup();
let activeLayer = plainLayer;
map.addLayer(activeLayer);

function iconFor(p, hl){
  const s = Math.round(22 + Math.min(p.cams, 20) * 1.1);
  const fs = p.cams >= 10 ? 11 : 12;
  return L.divIcon({className:'', iconSize:[s,s], iconAnchor:[s/2,s/2], popupAnchor:[0,-s/2],
    html:`<div class="pin${hl?' hl':''}" style="width:${s}px;height:${s}px;background:${TYPES[p.type]?.color||'#64748b'};font-size:${fs}px">${p.cams}</div>`});
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function popupHtml(p){
  const col = TYPES[p.type]?.color || '#64748b';
  return `<div class="pp">
    <span class="type" style="background:${col}">${esc(p.type)}</span>
    <h3>${esc(p.name)}</h3>
    <div class="code">${esc(p.code)}</div>
    <dl><dt>จำนวนกล้อง</dt><dd><b>${p.cams}</b> ตัว</dd>
        <dt>พิกัด</dt><dd>${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</dd></dl>
    <a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      เปิดใน Google Maps</a>
  </div>`;
}
points.forEach(p => {
  p.marker = L.marker([p.lat,p.lng], {icon:iconFor(p), pt:p, title:p.name});
  p.marker.bindPopup(popupHtml(p), {maxWidth:280, autoPanPaddingTopLeft:L.point(16, isMobile()?130:20), autoPanPaddingBottomRight:L.point(16, isMobile()?110:20)});
  p.marker.on('mouseover', ()=>highlight(p,true));
  p.marker.on('mouseout', ()=>highlight(p,false));
  p.marker.on('click', ()=>{ markActive(p); if (isMobile()) setSheet(0); });
});

// ---- state & UI ----
const state = {types:new Set(Object.keys(TYPES)), q:'', sort:'code'};
const chipsEl = document.getElementById('chips');
const maxTypeCams = Math.max(...Object.keys(TYPES).map(t => points.filter(p=>p.type===t).reduce((s,p)=>s+p.cams,0)));
Object.entries(TYPES).forEach(([t,info]) => {
  const pts = points.filter(p=>p.type===t), cams = pts.reduce((s,p)=>s+p.cams,0);
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.type = t;
  b.innerHTML = `<span class="sw" style="background:${info.color}"></span>
    <div style="flex:1"><div style="display:flex;justify-content:space-between;gap:8px">
      <span class="name">${info.label}</span><span class="cnt">${pts.length} จุด · ${cams} กล้อง</span></div>
      <div class="bar"><i style="width:${cams/maxTypeCams*100}%;background:${info.color}"></i></div></div>`;
  const m = document.createElement('button');
  m.className = 'mchip';
  m.innerHTML = `<span class="sw" style="background:${info.color}"></span>${info.label} <small>${cams}</small>`;
  const toggle = () => { state.types.has(t) ? state.types.delete(t) : state.types.add(t);
    const off = !state.types.has(t); b.classList.toggle('off', off); m.classList.toggle('off', off); render(); };
  b.onclick = toggle; m.onclick = toggle;
  chipsEl.appendChild(b); document.getElementById('mchips').appendChild(m);
});

const collator = new Intl.Collator('th', {numeric:true});
function filtered(){
  const q = state.q.toLowerCase();
  let arr = points.filter(p => state.types.has(p.type) && (!q || p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q)));
  if (state.sort==='cams') arr.sort((a,b)=>b.cams-a.cams || collator.compare(a.code,b.code));
  else if (state.sort==='name') arr.sort((a,b)=>collator.compare(a.name,b.name));
  else arr.sort((a,b)=>collator.compare(a.code,b.code));
  return arr;
}

const listEl = document.getElementById('list');
function render(fit){
  const arr = filtered();
  clusterLayer.clearLayers(); plainLayer.clearLayers();
  const ms = arr.map(p=>p.marker);
  activeLayer === clusterLayer ? clusterLayer.addLayers(ms) : ms.forEach(m=>plainLayer.addLayer(m));
  document.getElementById('sPts').textContent = arr.length.toLocaleString('th-TH');
  document.getElementById('sCams').textContent = arr.reduce((s,p)=>s+p.cams,0).toLocaleString('th-TH');
  document.getElementById('count').textContent = `แสดง ${arr.length} จาก ${points.length} จุด`;
  document.getElementById('mPts').textContent = arr.length.toLocaleString('th-TH');
  document.getElementById('mCams').textContent = arr.reduce((s,p)=>s+p.cams,0).toLocaleString('th-TH');
  listEl.innerHTML = arr.length ? '' : '<div class="empty">ไม่พบจุดที่ตรงกับเงื่อนไข</div>';
  const frag = document.createDocumentFragment();
  arr.forEach(p => {
    const d = document.createElement('div');
    d.className = 'item'; p.el = d;
    d.innerHTML = `<div class="badge" style="background:${TYPES[p.type]?.color}">${p.cams}</div>
      <div style="min-width:0"><div class="t">${esc(p.name)}</div><div class="c">${esc(p.code)}</div></div>`;
    d.onclick = () => focusPoint(p);
    d.onmouseenter = () => highlight(p,true);
    d.onmouseleave = () => highlight(p,false);
    frag.appendChild(d);
  });
  listEl.appendChild(frag);
  if (fit && arr.length) map.fitBounds(L.latLngBounds(arr.map(p=>[p.lat,p.lng])), {padding:[40,40], maxZoom:17});
}
function highlight(p,on){
  p.marker.setIcon(iconFor(p,on));
  if (p.el) p.el.classList.toggle('active', on || p===activePt);
}
let activePt = null;
function markActive(p){
  if (activePt?.el) activePt.el.classList.remove('active');
  activePt = p;
  if (p.el){ p.el.classList.add('active'); p.el.scrollIntoView({block:'nearest', behavior:'smooth'}); }
}
function focusPoint(p){
  markActive(p);
  if (isMobile()) setSheet(0);
  const open = () => { map.setView([p.lat,p.lng], Math.max(map.getZoom(),17), {animate:true}); p.marker.openPopup(); };
  activeLayer === clusterLayer ? clusterLayer.zoomToShowLayer(p.marker, open) : open();
}

const panel = document.getElementById('panel');
const qIn = document.getElementById('q'), mqIn = document.getElementById('mq'), mclr = document.getElementById('mclr');
let t;
function onSearch(v, src){
  if (src !== qIn) qIn.value = v;
  if (src !== mqIn) mqIn.value = v;
  mclr.classList.toggle('on', !!v);
  clearTimeout(t);
  t = setTimeout(()=>{ state.q = v.trim(); render(!!state.q); if (isMobile() && state.q && sheetIdx===0) setSheet(1); }, 180);
}
qIn.addEventListener('input', e => onSearch(e.target.value, qIn));
mqIn.addEventListener('input', e => onSearch(e.target.value, mqIn));
mqIn.addEventListener('keydown', e => { if (e.key==='Enter') mqIn.blur(); });
mclr.addEventListener('click', () => { onSearch('', null); mqIn.focus(); });

const sortSel = document.getElementById('sort'), msort = document.getElementById('msort');
[sortSel, msort].forEach(s => s.addEventListener('change', e => { state.sort = sortSel.value = msort.value = e.target.value; render(); }));

document.getElementById('cluster').addEventListener('change', e => {
  map.removeLayer(activeLayer);
  activeLayer = e.target.checked ? clusterLayer : plainLayer;
  map.addLayer(activeLayer); render();
});

// ---- bottom sheet (mobile) ----
const PEEK = 88;
const snaps = () => [PEEK, Math.round(innerHeight*0.5), Math.round(innerHeight - 70)];
let sheetIdx = 0;
function setSheet(i){
  sheetIdx = i;
  panel.style.setProperty('--sheet-h', snaps()[i] + 'px');
  panel.classList.toggle('expanded', i > 0);
  document.getElementById('hintTxt').textContent = i > 0 ? 'ย่อ' : 'ดูรายการ';
}
const head = document.getElementById('panelHead');
let drag = null;
head.addEventListener('pointerdown', e => {
  if (!isMobile()) return;
  drag = {y:e.clientY, h:panel.getBoundingClientRect().height, moved:false};
  panel.classList.add('dragging'); head.setPointerCapture(e.pointerId);
});
head.addEventListener('pointermove', e => {
  if (!drag) return;
  const dy = e.clientY - drag.y;
  if (Math.abs(dy) > 6) drag.moved = true;
  const [min,,max] = snaps();
  panel.style.setProperty('--sheet-h', Math.max(min, Math.min(max, drag.h - dy)) + 'px');
});
const endDrag = e => {
  if (!drag) return;
  panel.classList.remove('dragging');
  if (!drag.moved) setSheet(sheetIdx === 0 ? 1 : 0);
  else {
    const h = panel.getBoundingClientRect().height, s = snaps();
    let best = 0; s.forEach((v,i) => { if (Math.abs(v-h) < Math.abs(s[best]-h)) best = i; });
    // flick bias
    if (e.clientY - drag.y < -60 && best === sheetIdx) best = Math.min(2, sheetIdx+1);
    if (e.clientY - drag.y > 60 && best === sheetIdx) best = Math.max(0, sheetIdx-1);
    setSheet(best);
  }
  drag = null;
};
head.addEventListener('pointerup', endDrag);
head.addEventListener('pointercancel', endDrag);
map.on('dragstart', () => { if (isMobile() && sheetIdx > 0) setSheet(0); });
function syncLayout(){
  msort.style.display = isMobile() ? '' : 'none';
  if (isMobile()) setSheet(sheetIdx); else panel.style.removeProperty('--sheet-h');
}
mq.addEventListener('change', syncLayout);
addEventListener('resize', () => { if (isMobile()) setSheet(sheetIdx); });
syncLayout();

// ---- locate me ----
const toastEl = document.getElementById('toast');
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastEl._t); toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), 2600); }
let meMarker;
const Locate = L.Control.extend({
  options:{position:'topright'},
  onAdd(){
    const wrap = L.DomUtil.create('div','leaflet-bar');
    const b = L.DomUtil.create('button','locbtn', wrap);
    b.title = 'ตำแหน่งของฉัน'; b.setAttribute('aria-label','ตำแหน่งของฉัน');
    b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>';
    L.DomEvent.disableClickPropagation(wrap);
    b.onclick = () => { b.classList.add('busy'); map.locate({setView:true, maxZoom:17, enableHighAccuracy:true}); };
    map.on('locationfound', e => { b.classList.remove('busy');
      if (meMarker) meMarker.setLatLng(e.latlng);
      else meMarker = L.marker(e.latlng, {icon:L.divIcon({className:'', html:'<div class="me"></div>', iconSize:[16,16]}), zIndexOffset:1000}).addTo(map); });
    map.on('locationerror', () => { b.classList.remove('busy'); toast('ไม่สามารถระบุตำแหน่งได้ กรุณาอนุญาตการเข้าถึงตำแหน่ง'); });
    return wrap;
  }
});
new Locate().addTo(map);

render(true);
</script>
</body>
</html>
